        "lattice",
        "quantreg",
        "svUnit",
        "tcltk",
        "zoo"
      ],
      "License": "GPL (>= 2)",
      "URL": "https://github.com/ggrothendieck/gsubfn",
      "NeedsCompilation": "no",
      "Repository": "CRAN"
    },
